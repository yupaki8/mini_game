<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国旗当てクイズ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Rounded Mplus 1c", "Meiryo", sans-serif;
    background: linear-gradient(160deg, #8ec5ff 0%, #a6e6c8 55%, #fff4b8 100%);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 12px 0 rgba(0,0,0,0.12), 0 20px 40px rgba(0,0,0,0.18);
    padding: 22px 22px 26px;
    position: relative;
    overflow: hidden;
  }
  h1 {
    text-align: center;
    font-size: 26px;
    color: #3a5a8c;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #8a97a8;
    margin-bottom: 14px;
  }

  /* ---- top bar ---- */
  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: bold;
    color: #4a5a70;
    margin-bottom: 8px;
  }
  #progressWrap {
    height: 10px;
    background: #eef1f6;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7fd3ff, #6bd6a0);
    border-radius: 6px;
    transition: width 0.35s ease;
  }

  /* ---- flag card ---- */
  #flagCard {
    background: #f3f7fc;
    border-radius: 20px;
    padding: 26px 10px;
    text-align: center;
    margin-bottom: 16px;
    border: 3px solid #e2ecf7;
  }
  #flagEmoji {
    font-size: 108px;
    line-height: 1;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    animation: pop 0.35s ease;
  }
  @keyframes pop {
    0%   { transform: scale(0.6); opacity: 0; }
    70%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ---- hint ---- */
  #hintBtn {
    display: block;
    margin: 0 auto 10px;
    background: #ffe08a;
    border: none;
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: bold;
    color: #8a5a00;
    cursor: pointer;
    box-shadow: 0 3px 0 #e0b84a;
  }
  #hintBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0b84a; }
  #hintBtn:disabled { opacity: 0.45; cursor: default; }
  #hintBox {
    min-height: 4px;
    margin-bottom: 12px;
    font-size: 14px;
    color: #5a6b40;
    text-align: center;
  }
  #hintBox p { margin-top: 4px; }

  /* ---- choices ---- */
  #choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .choiceBtn {
    background: #eef4ff;
    border: 2px solid #d6e4fa;
    border-radius: 12px;
    padding: 10px 6px;
    font-size: 14px;
    font-weight: bold;
    color: #2c4667;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .choiceBtn:hover:not(:disabled) { background: #dceaff; }
  .choiceBtn:active:not(:disabled) { transform: scale(0.97); }
  .choiceBtn:disabled { cursor: default; }
  .choiceBtn.correct { background: #b9f0c4; border-color: #6bd68a; color: #1f6a34; }
  .choiceBtn.wrong   { background: #ffc4c4; border-color: #ef8a8a; color: #8a2323; }
  .choiceBtn.dim     { opacity: 0.55; }

  /* ---- feedback ---- */
  #feedback {
    min-height: 60px;
    text-align: center;
    font-size: 15px;
    color: #3a5a3a;
    margin-bottom: 8px;
  }
  #feedback .big {
    font-size: 20px;
    font-weight: bold;
    display: block;
    margin-bottom: 4px;
  }
  #nextBtn {
    display: block;
    margin: 4px auto 0;
    background: #6bb7ff;
    color: white;
    border: none;
    border-radius: 999px;
    padding: 11px 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #3d8ad6;
  }
  #nextBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3d8ad6; }

  /* ---- overlays ---- */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 24px;
    border-radius: 28px;
  }
  .overlay h2 {
    font-size: 28px;
    color: #3a5a8c;
    margin-bottom: 10px;
  }
  .overlay p { font-size: 15px; color: #667; margin-bottom: 18px; line-height: 1.6; }
  .bigBtn {
    background: #ff9f5a;
    color: white;
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #d9762c;
  }
  .bigBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9762c; }
  #stars { font-size: 40px; margin-bottom: 6px; letter-spacing: 4px; }
  .hidden { display: none !important; }
  #flagDeco { font-size: 50px; margin-bottom: 10px; }

  @media (max-width: 420px) {
    #flagEmoji { font-size: 84px; }
    .choiceBtn { font-size: 12px; padding: 9px 4px; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>🌍 国旗当てクイズ 🌍</h1>
  <div class="subtitle">国旗を見て国の名前をあててね！わからないときはヒントを見よう</div>

    <span id="scoreText">せいかい 0問</span>
  </div>

  </div>

  <button id="hintBtn">💡 ヒントを見る (のこり3回)</button>
  <div id="hintBox"></div>

  <div id="choices"></div>

  <div id="feedback"></div>
  <button id="nextBtn" class="hidden">つぎの問題へ ▶</button>

  <!-- start overlay -->
  <div id="startOverlay" class="overlay">
    <div id="flagDeco">🇯🇵🇫🇷🇧🇷🇰🇪</div>
    <h2>国旗当てクイズ</h2>
    <p>ぜんぶで10問！国旗を見て、あてはまる国の名前をえらぼう。<br>

    <button id="startBtn" class="bigBtn">はじめる ▶</button>
  </div>

</div>

  const TOTAL_QUESTIONS = 10;

  // ============================================================
  // Sound (Web Audio API, no external files)
  // ============================================================
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function tone(freq, dur, type, vol, delay = 0) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.start(t0); o.stop(t0 + dur);
  }
  function sfxCorrect() { tone(660, 0.1, 'sine', 0.15); tone(880, 0.14, 'sine', 0.15, 0.1); }
  function sfxWrong()   { tone(180, 0.25, 'sawtooth', 0.13); }
  function sfxHint()    { tone(520, 0.08, 'triangle', 0.1); }
  function sfxClear()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'sine', 0.15, i * 0.12)); }

  // ============================================================
  // Helpers
  // ============================================================
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = ~~(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ============================================================
  // Game state
  // ============================================================
  let quizList = [];
  let qIndex = 0;
  let correctCount = 0;
  let hintsLeft = 3;
  let answered = false;
  let currentChoices = [];
  let current = null;

  // ============================================================
  // DOM refs
  // ============================================================
  const flagEmoji   = document.getElementById('flagEmoji');
  const choicesBox  = document.getElementById('choices');
  const hintBtn     = document.getElementById('hintBtn');
  const hintBox     = document.getElementById('hintBox');
  const feedback    = document.getElementById('feedback');
  const nextBtn     = document.getElementById('nextBtn');
  const qCounter    = document.getElementById('qCounter');
  const scoreText   = document.getElementById('scoreText');
  const progressBar = document.getElementById('progressBar');
  const startOverlay  = document.getElementById('startOverlay');
  const resultOverlay = document.getElementById('resultOverlay');
  const startBtn    = document.getElementById('startBtn');
  const retryBtn    = document.getElementById('retryBtn');
  const starsEl     = document.getElementById('stars');
  const resultText  = document.getElementById('resultText');

  // ============================================================
  // Flow
  // ============================================================
  function startGame() {
    initAudio();
    quizList = shuffle(COUNTRIES).slice(0, TOTAL_QUESTIONS);
    qIndex = 0; correctCount = 0;
    startOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    hintsLeft = 3;
    current = quizList[qIndex];

    // build 4 choices
    const wrongPool = shuffle(COUNTRIES.filter(c => c.name !== current.name)).slice(0, 9);
    currentChoices = shuffle([current, ...wrongPool]);

    flagEmoji.textContent = flagFromCC(current.cc);
    flagEmoji.style.animation = 'none';
    void flagEmoji.offsetWidth; // restart animation
    flagEmoji.style.animation = 'pop 0.35s ease';

    hintBox.innerHTML = '';
    hintBtn.disabled = false;
    hintBtn.textContent = `💡 ヒントを見る (のこり${hintsLeft}回)`;

    feedback.innerHTML = '';
    nextBtn.classList.add('hidden');

    qCounter.textContent = `だい${qIndex + 1}問 / ${TOTAL_QUESTIONS}問`;
    scoreText.textContent = `せいかい ${correctCount}問`;
    progressBar.style.width = `${(qIndex / TOTAL_QUESTIONS) * 100}%`;

    renderChoices();
  }

  function renderChoices() {
    choicesBox.innerHTML = '';
    currentChoices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choiceBtn';
      btn.textContent = c.name;
      btn.addEventListener('click', () => selectAnswer(c, btn));
      choicesBox.appendChild(btn);
    });
  }

  function showHint() {
    if (hintsLeft <= 0 || answered) return;
    sfxHint();
    const step = 3 - hintsLeft;
    const lines = [
      `🗺️ 大陸(ちいき)：${current.continent}`,
      `🏛️ 首都：${current.capital}`,
      `✨ とくちょう：${current.feature}`,
    ];
    const p = document.createElement('p');
    p.textContent = lines[step];
    hintBox.appendChild(p);
    hintsLeft--;
    hintBtn.textContent = hintsLeft > 0
      ? `💡 ヒントを見る (のこり${hintsLeft}回)`
      : '💡 ヒントはもうないよ';
    if (hintsLeft <= 0) hintBtn.disabled = true;
  }

  function selectAnswer(choice, btn) {
    if (answered) return;
    answered = true;
    hintBtn.disabled = true;

    const buttons = choicesBox.querySelectorAll('.choiceBtn');
    const isCorrect = choice.name === current.name;

    buttons.forEach(b => {
      b.disabled = true;
      if (b.textContent === current.name) b.classList.add('correct');
      else b.classList.add('dim');
    });
    if (!isCorrect) btn.classList.add('wrong');

    if (isCorrect) {
      correctCount++;
      sfxCorrect();
      feedback.innerHTML = `<span class="big">🎉 せいかい！</span>${current.name}（首都：${current.capital}）`;
    } else {
      sfxWrong();
      feedback.innerHTML = `<span class="big">😢 ざんねん…</span>正解は「${current.name}」（首都：${current.capital}）だったよ`;
    }
    scoreText.textContent = `せいかい ${correctCount}問`;
    progressBar.style.width = `${((qIndex + 1) / TOTAL_QUESTIONS) * 100}%`;

    nextBtn.classList.remove('hidden');
    nextBtn.textContent = (qIndex + 1 < TOTAL_QUESTIONS) ? 'つぎの問題へ ▶' : 'けっかを見る ▶';
  }

  function nextQuestion() {
    qIndex++;
    if (qIndex >= TOTAL_QUESTIONS) {
      showResult();
    } else {
      loadQuestion();
    }
  }

  function showResult() {
    sfxClear();
    let stars, comment;
    if (correctCount === 10)      { stars = '⭐⭐⭐⭐⭐'; comment = 'すごい！国旗はかせだね！！'; }
    else if (correctCount >= 8)   { stars = '⭐⭐⭐⭐';   comment = 'とてもよくできました！'; }
    else if (correctCount >= 6)   { stars = '⭐⭐⭐';     comment = 'よくできました！このちょうし！'; }
    else if (correctCount >= 4)   { stars = '⭐⭐';       comment = 'なかなかいいね！もう少しれんしゅうしよう'; }
    else                          { stars = '⭐';         comment = 'もう一度ちょうせんしてみよう！'; }

    starsEl.textContent = stars;
    resultText.textContent = `10問中 ${correctCount}問せいかい！\n${comment}`;
    resultText.style.whiteSpace = 'pre-line';
    resultOverlay.classList.remove('hidden');
  }

  // ============================================================
  // Events
  // ============================================================
  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);
  hintBtn.addEventListener('click', showHint);
  nextBtn.addEventListener('click', nextQuestion);

  document.addEventListener('keydown', e => {
    if (!startOverlay.classList.contains('hidden')) {
      if (e.code === 'Enter' || e.code === 'Space') startGame();
      return;
    }
    if (!resultOverlay.classList.contains('hidden')) {
      if (e.code === 'Enter' || e.code === 'Space') startGame();
      return;
    }
    if (!answered && ['1','2','3','4','5','6','7','8','9','0'].includes(e.key)) {
      const idx = e.key === '0' ? 9 : Number(e.key) - 1;
      const btns = choicesBox.querySelectorAll('.choiceBtn');
      if (btns[idx]) selectAnswer(currentChoices[idx], btns[idx]);
    } else if (answered && (e.code === 'Enter' || e.code === 'Space')) {
      nextQuestion();
    } else if (!answered && e.key.toLowerCase() === 'h') {
      showHint();
    }
  });
})();
</script>
</body>
</html>
